<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada | Peluquería y Barbería Adrián Millán</title>
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <meta name="robots" content="noindex, follow" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #09090b;
        color: #f4f4f5;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .container {
        max-width: 480px;
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #eab308;
        background: rgba(234, 179, 8, 0.1);
        border: 1px solid rgba(234, 179, 8, 0.25);
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 3.5rem;
        font-weight: 800;
        color: #ffffff;
        line-height: 1;
        margin-bottom: 0.5rem;
      }
      h2 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #e4e4e7;
        margin-bottom: 1rem;
      }
      p {
        color: #a1a1aa;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: linear-gradient(135deg, #eab308, #ca8a04);
        color: #09090b;
        font-weight: 700;
        font-size: 0.95rem;
        text-decoration: none;
        padding: 0.85rem 1.75rem;
        border-radius: 0.85rem;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .btn:hover {
        opacity: 0.92;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">Adrián Millán Barbería</div>
      <h1>404</h1>
      <h2>Página no encontrada</h2>
      <p>La página que buscas no existe o ha sido movida. Puedes volver al inicio para reservar tu cita previa.</p>
      <a href="/" class="btn">Volver al Inicio</a>
    </div>
  </body>
</html>
